version: '3.8'

services:
  mysql-banco:
    image: mysql:8.0
    container_name: mysql-banco
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-banco_secret}
      MYSQL_DATABASE: ${DB_NAME:-sistema_bancario}
      TZ: America/Sao_Paulo
    ports:
      - "3308:3306"
    volumes:
      - mysql_banco_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone="-03:00"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-banco_secret}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_banco_data:
